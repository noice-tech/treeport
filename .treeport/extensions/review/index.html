<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review</title>
    <link rel="stylesheet" href="review.css" />
  </head>
  <body>
    <header>
      <div>
        <strong>Code review</strong><span id="summary">Loading context…</span>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </header>
    <div class="workspace">
      <aside aria-label="Changed files">
        <h2>Changed files</h2>
        <div id="file-tree"></div>
      </aside>
      <div
        id="resize-handle"
        role="separator"
        aria-label="Resize changed files"
        aria-orientation="vertical"
        aria-valuemin="160"
        tabindex="0"
      ></div>
      <main id="review" aria-live="polite"><p>Loading diff…</p></main>
    </div>
    <script type="module" src="review.js"></script>
  </body>
</html>
