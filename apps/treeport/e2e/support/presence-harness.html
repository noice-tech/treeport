<!doctype html>
<html lang="en">
  <head>
    <title>Workspace presence check</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useEffect, useState } from 'react'
      import { createRoot } from 'react-dom/client'
      import { useWorkspacePresence } from '/src/web/features/presence/use-workspace-presence.ts'
      import { WorkspaceViewers } from '/src/web/features/presence/workspace-viewers.tsx'
      import { project } from './project.ts'
      import '/src/web/styles.css'

      const tree = {
        ...project.worktrees[0],
        panels: [
          { id: 'panel_pi', title: 'Pi' },
          { id: 'panel_review', title: 'Review' }
        ]
      }
      function Harness() {
        const [panel, setPanel] = useState('panel_pi')
        const [worktreeId, setWorktreeId] = useState(tree.id)
        const presence = useWorkspacePresence(worktreeId, panel)
        useEffect(() => {
          const update = (event) => presence.setViewers(event.detail)
          window.addEventListener('test-presence', update)
          return () => window.removeEventListener('test-presence', update)
        }, [presence.setViewers])
        return React.createElement(
          React.Fragment,
          null,
          React.createElement(WorkspaceViewers, {
            worktree: { ...tree, id: worktreeId },
            ...presence
          }),
          React.createElement(
            'button',
            { onClick: () => setPanel('panel_review') },
            'Focus Review'
          ),
          React.createElement(
            'button',
            { onClick: () => setWorktreeId('wt_topic') },
            'Open topic workspace'
          )
        )
      }
      createRoot(document.getElementById('root')).render(
        React.createElement(Harness)
      )
    </script>
  </body>
</html>
