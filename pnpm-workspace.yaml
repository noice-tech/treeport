packages:
  - apps/*
  - packages/*

hoistPattern:
  # Playwright resolves Electron from its own package during desktop tests.
  - electron
  - update-electron-app
  - vite
  # @astrojs/mdx imports this transitive dependency directly.
  - satteri

catalog:
  '@fontsource-variable/inter': ^5.2.8
  '@radix-ui/react-dialog': ^1.1.23
  '@radix-ui/react-dropdown-menu': ^2.1.21
  '@tailwindcss/vite': ^4.3.3
  '@types/react': ^19.2.10
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^5.1.4
  lucide-react: ^1.25.0
  react: ^19.3.0
  react-dom: ^19.3.0
  sharp: ^0.35.2
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: ^8.1.5
  zod: ^4.4.3

catalogs:
  docs:
    typescript: ^6.0.3

overrides:
  '@electron/rebuild': 4.2.0
  fast-uri: 3.1.4
  tar: 7.5.19
  tmp: 0.2.6

allowBuilds:
  '@google/genai': false
  '@parcel/watcher': false
  better-sqlite3: true
  electron: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  msgpackr-extract: false
  node-pty: true
  protobufjs: false
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@4.20260722.1
  - wrangler@4.115.0
